<section class="flex flex-col gap-6" id="events-section">
  <!-- Header Bar -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-card">
    <div>
      <div class="flex items-center gap-2">
        <h2 class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">Time-Stamped Events Log</h2>
        <span class="px-2 py-0.5 text-[10px] font-bold uppercase bg-brand-50 text-brand-700 dark:bg-brand-950/50 dark:text-brand-300 border border-brand-200 dark:border-brand-800 rounded-full">Continuous Ledger</span>
      </div>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-2xl">
        Complete audit trail of all entry/exit line crossings, zone transitions, dwell times, and detected carried accessories.
      </p>
    </div>

    <div class="flex items-center gap-2">
      <select id="event-type-filter" onchange="loadEventsData()" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-200">
        <option value="">All Event Types</option>
        <option value="ENTRY">ENTRY (Tripwire)</option>
        <option value="EXIT">EXIT (Tripwire)</option>
        <option value="RESTRICTED_ZONE">RESTRICTED_ZONE</option>
        <option value="LOITERING">LOITERING</option>
        <option value="ODD_HOUR_VISIT">ODD_HOUR_VISIT</option>
      </select>
      <button onclick="loadEventsData()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 cursor-pointer">Refresh</button>
    </div>
  </div>

  <!-- Events Table -->
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-slate-500 font-semibold uppercase tracking-wider text-[10px]">
            <th class="p-3.5">Timestamp (UTC)</th>
            <th class="p-3.5">Event Type</th>
            <th class="p-3.5">Visitor</th>
            <th class="p-3.5">Camera / Stream</th>
            <th class="p-3.5">Carried Items</th>
            <th class="p-3.5">Dwell Duration</th>
            <th class="p-3.5 text-right">Evidence Crop</th>
          </tr>
        </thead>
        <tbody id="events-table-body" class="divide-y divide-slate-100 dark:divide-slate-800">
          <tr><td colspan="7" class="p-8 text-center text-slate-400">Loading events ledger...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
  window.loadEventsData = function() {
    var tbody = document.getElementById('events-table-body');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400">Loading events...</td></tr>';

    var etype = document.getElementById('event-type-filter') ? document.getElementById('event-type-filter').value : '';
    var url = '/api/v2/events?limit=100';
    if (etype) url += '&event_type=' + encodeURIComponent(etype);

    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var list = data.events || [];
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400 italic">No events recorded yet.</td></tr>';
          return;
        }

        var html = '';
        list.forEach(function(ev) {
          var badgeCls = 'bg-brand-50 text-brand-700 dark:bg-brand-950/50 dark:text-brand-300 border-brand-200';
          if (ev.event_type === 'EXIT') badgeCls = 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-300';
          if (ev.event_type === 'RESTRICTED_ZONE') badgeCls = 'bg-red-50 text-red-700 dark:bg-red-950/50 dark:text-red-300 border-red-200';
          if (ev.event_type === 'LOITERING') badgeCls = 'bg-amber-50 text-amber-700 dark:bg-amber-950/50 dark:text-amber-300 border-amber-200';

          var ts = ev.timestamp ? ev.timestamp.replace('T', ' ').substring(0, 19) : '—';
          var visStr = ev.visitor_code ? (ev.visitor_code + ' (' + (ev.visitor_category || 'Unknown') + ')') : 'Anonymous / Untracked';
          var objsStr = (ev.detected_objects && ev.detected_objects.length > 0) ? ev.detected_objects.join(', ') : 'None';

          html += '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
            '<td class="p-3.5 font-mono text-[11px] text-slate-500 whitespace-nowrap">' + ts + '</td>' +
            '<td class="p-3.5"><span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase border ' + badgeCls + '">' + ev.event_type + '</span></td>' +
            '<td class="p-3.5 font-semibold text-slate-800 dark:text-slate-200">' + escapeHtml(visStr) + '</td>' +
            '<td class="p-3.5 text-slate-600 dark:text-slate-400">' + escapeHtml(ev.camera_name || ('Camera #' + ev.camera_id)) + '</td>' +
            '<td class="p-3.5 text-slate-600 dark:text-slate-400">' + escapeHtml(objsStr) + '</td>' +
            '<td class="p-3.5 font-mono text-[11px] text-slate-600 dark:text-slate-300">' + (ev.duration_seconds > 0 ? (ev.duration_seconds + 's') : '—') + '</td>' +
            '<td class="p-3.5 text-right">' +
              (ev.thumbnail_path ? '<span class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 text-[10px] font-mono text-brand-600 font-bold">SNAPSHOT SAVED</span>' : '<span class="text-slate-400 text-[10px]">No crop</span>') +
            '</td>' +
          '</tr>';
        });

        tbody.innerHTML = html;
      })
      .catch(function(err) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-red-500">Failed to load events: ' + err.message + '</td></tr>';
      });
  };

  loadEventsData();
</script>

<!-- Shared placeholder card for pages delivered in later phases. Vars: ptitle, pphase, pdesc, pfeatures (list) -->
<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-card">
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div>
      <h2 class="font-display font-bold text-xl text-slate-900 dark:text-white">{{ ptitle }}</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-2xl">{{ pdesc }}</p>
    </div>
    <span class="px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-amber-50 text-amber-700 dark:bg-amber-950/40 dark:text-amber-300 border border-amber-200 dark:border-amber-800">
      Planned &middot; {{ pphase }}
    </span>
  </div>
  <ul class="mt-5 grid sm:grid-cols-2 gap-2.5">
    {% for f in pfeatures %}
    <li class="flex items-start gap-2 text-sm text-slate-700 dark:text-slate-300">
      <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-brand-500 shrink-0"></span><span>{{ f }}</span>
    </li>
    {% endfor %}
  </ul>
</div>

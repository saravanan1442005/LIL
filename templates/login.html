<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — {{ product }}</title>
  <meta name="description" content="{{ slogan }}">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {
      colors: { brand: { 50:'#ecfdf5',100:'#d1fae5',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',900:'#064e3b' } },
      fontFamily: { sans: ['Plus Jakarta Sans','sans-serif'], display: ['Outfit','sans-serif'] } } } }
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="font-display font-extrabold text-3xl tracking-tight text-slate-900 dark:text-white">ECOLIFY<span class="text-brand-600 dark:text-brand-400">BUDDY</span></h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">{{ slogan }}</p>
    </div>
    <form id="login-form" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-lg space-y-4" onsubmit="handleLogin(event)" aria-label="Sign in">
      <div id="login-alert" class="hidden text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 rounded-xl p-3"></div>
      
      <div>
        <label for="email" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Email</label>
        <input id="email" type="email" autocomplete="username" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="admin@example.com">
      </div>
      <div>
        <label for="password" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Password</label>
        <input id="password" type="password" autocomplete="current-password" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="••••••••">
      </div>
      <button id="login-submit" type="submit" class="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold transition-all shadow-sm cursor-pointer">Sign in</button>
      
      <div class="pt-2 text-[11px] text-slate-500 dark:text-slate-400 space-y-1">
        <p>Default seeded admin: <code class="font-mono text-brand-600 dark:text-brand-400">admin@example.com</code> / <code class="font-mono text-brand-600 dark:text-brand-400">Admin@12345</code> (or see <code>.env</code>)</p>
        <p>Roles supported: <strong>Admin, Security Officer, Viewer, Auditor</strong>.</p>
      </div>
    </form>
    <p class="text-center text-xs mt-4"><a href="/" class="text-brand-600 hover:underline">Back to dashboard</a> · <a href="/about" class="text-brand-600 hover:underline">About</a></p>
  </main>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var alertBox = document.getElementById('login-alert');
      var btn = document.getElementById('login-submit');

      alertBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = 'Signing in...';

      fetch('/api/v2/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(function(res) {
        return res.json().then(function(data) {
          if (!res.ok) throw new Error(data.error || 'Login failed.');
          return data;
        });
      })
      .then(function(data) {
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('user_profile', JSON.stringify(data.user));
        var next = new URLSearchParams(window.location.search).get('next') || '/';
        window.location.href = next;
      })
      .catch(function(err) {
        alertBox.innerText = err.message;
        alertBox.classList.remove('hidden');
      })
      .finally(function() {
        btn.disabled = false;
        btn.innerText = 'Sign in';
      });
    }
  </script>
</body>
</html>
